name: lab2-iris

services:
  # Service 1: Train the model and write it to the shared volume
  model-training:
    build:
      context: .
      dockerfile: dockerfile
      target: model_training      # reuse the training stage of the multi-stage Dockerfile
    image: lab2-iris-trainer:latest
    container_name: ml_trainer
    environment:
      MODEL_DIR: /models
    volumes:
      - model_exchange:/models    # Shared volume mount
    networks:
      - ml_net

  # Service 2: Serve the model from the shared volume
  serving:
    build:
      context: .
      dockerfile: dockerfile
      target: serving
      args:
        PORT: ${PORT:-4000}
    image: lab2-iris-serving:latest
    container_name: ml_serving
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      PORT: ${PORT:-4000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      MODEL_PATH: /models/my_model.keras    # model freshly trained by model-training
      SCALER_PATH: /models/scaler.pkl
    volumes:
      - model_exchange:/models:ro           # read-only: serving never modifies the model
    depends_on:
      model-training:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-4000}/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - ml_net

volumes:
  model_exchange:

networks:
  ml_net:
    driver: bridge
