name: Lab 1 - Unittests
run-name: Lab 1 Unittests run by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths:
      - 'lab_1/**'
      - '.github/workflows/unittest_action.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lab_1/**'
      - '.github/workflows/unittest_action.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: lab_1/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unittests
      run: python -m unittest discover -s test -p "test_unittest.py" -v

    - name: Notify on success
      if: success()
      run: echo "Lab 1 unit tests passed successfully"

    - name: Notify on failure
      if: failure()
      run: echo "Lab 1 unit tests failed"
